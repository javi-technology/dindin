  /api/fridges/{fridgeId}/items/{id}/unfreeze:
    parameters:
      - name: fridgeId
        in: path
        required: true
        schema: { type: string }
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Retira o item da geladeira e devolve à carteira
      operationId: unfreezeItem
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UnfreezeItemRequest' }
      responses:
        '201':
          description: Posição criada na carteira
          content:
