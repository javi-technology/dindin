            schema: { $ref: '#/components/schemas/UpdateFridgeItemRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FridgeItem' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      summary: Exclui o item
      operationId: deleteItem
