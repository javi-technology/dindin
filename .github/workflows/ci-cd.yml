name: CI/CD

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

# Permissão mínima do GITHUB_TOKEN; jobs que precisam de mais declaram a sua.
permissions:
  contents: read

jobs:
  # Calcula a versão semântica em tempo de execução a partir da última tag
  # vX.Y.Z e dos Conventional Commits desde ela:
  #   - "tipo!:" ou "BREAKING CHANGE" no corpo → major
  #   - "feat"                                  → minor
  #   - demais commits                          → patch
  # Na main a versão é final (ex.: 1.2.0) e vira tag após o deploy. Nas demais
  # branches e PRs é uma pré-release (ex.: 1.2.0-develop.42+a1b2c3d).
  version:
    name: Calcular versão
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.semver.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Calcular versão semântica
        id: semver
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          IS_RELEASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail

          LAST_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)
          if [ -n "$LAST_TAG" ]; then
            RANGE="$LAST_TAG..HEAD"
            BASE="${LAST_TAG#v}"
          else
            RANGE="HEAD"
            BASE="0.0.0"
          fi
          IFS=. read -r MAJOR MINOR PATCH <<< "$BASE"

          SUBJECTS=$(git log "$RANGE" --no-merges --format='%s')
          BODIES=$(git log "$RANGE" --no-merges --format='%b')

          if [ -z "$SUBJECTS" ]; then
            BUMP=none
          elif grep -qE '^[a-z]+(\([^)]*\))?!:' <<< "$SUBJECTS" || grep -q 'BREAKING CHANGE' <<< "$BODIES"; then
            BUMP=major
          elif grep -qE '^feat(\([^)]*\))?:' <<< "$SUBJECTS"; then
            BUMP=minor
          else
            BUMP=patch
          fi

          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          VERSION="$MAJOR.$MINOR.$PATCH"
          if [ "$IS_RELEASE" != "true" ]; then
            SLUG=$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g')
            VERSION="$VERSION-$SLUG.${{ github.run_number }}+$(git rev-parse --short HEAD)"
          fi

          echo "Última tag: ${LAST_TAG:-nenhuma} | incremento: $BUMP | versão: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # Falha o pipeline se houver vulnerabilidade high/critical em dependências
  # de runtime. Usa só o package-lock.json, sem instalar dependências.
  audit:
    name: Auditar dependências
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: npm audit (runtime, high+)
        run: npm audit --audit-level=high --omit=dev

  # Análise estática de todo o monorepo (issue #220). Roda em paralelo com os
  # builds e bloqueia o deploy, para que problema de lint não chegue na main.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # A formatação não era verificada em lugar nenhum e dependia de
      # disciplina manual (issue #323). O job lint já é exigido pelo deploy.
      - name: Verificar formatação
        run: npm run format:check

  build-and-test-api:
    name: Build and Test API
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build API
        run: npm run api:build

      - name: Test API
        run: npm run test:coverage --workspace=apps/api

      - name: Upload API coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-api
          path: apps/api/coverage
          retention-days: 7

      # Sobe o artefato compilado da API para ser reutilizado pelo deploy,
      # evitando rebuild desnecessário. Executado apenas em push na main.
      - name: Upload API artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: api-lib
          path: apps/api/lib
          retention-days: 3

  build-and-test-web:
    name: Build and Test Web
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Injeta a versão calculada no build para exibição no rodapé.
      - name: Definir versão do app
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
        run: |
          printf "export const APP_VERSION = '%s';\n" "$APP_VERSION" > apps/web/src/environments/version.ts

      - name: Build Web
        run: npm run web:build

      - name: Test Web
        run: npm run test:coverage --workspace=apps/web

      - name: Upload Web coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-web
          path: apps/web/coverage
          retention-days: 7

      # Sobe o artefato compilado do Angular para ser reutilizado pelo deploy,
      # evitando rebuild desnecessário. Executado apenas em push na main.
      - name: Upload Web artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: apps/web/dist/dindin-web
          retention-days: 3

  deploy:
    name: Deploy to Firebase
    needs:
      - version
      - audit
      - lint
      - build-and-test-api
      - build-and-test-web
    # Executa apenas em push direto na main, após CI passar.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    # Necessário para publicar a tag da versão.
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download API artifact
        uses: actions/download-artifact@v8
        with:
          name: api-lib
          path: apps/api/lib

      - name: Download Web artifact
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: apps/web/dist/dindin-web

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # Variáveis de ambiente não sensíveis das Functions (ex.: limite de
      # tickers por requisição na Brapi, ids dos Prices da Stripe) são
      # carregadas via arquivo .env específico do projeto, lido pelo Firebase
      # Functions v2 no deploy. Secrets (STRIPE_SECRET_KEY etc.) ficam no
      # Secret Manager. Ver https://firebase.google.com/docs/functions/config-env
      - name: Configurar variáveis de ambiente das Functions
        run: |
          cat >> apps/api/.env.dindin-4e720 <<EOF
          BRAPI_MAX_SYMBOLS_PER_REQUEST=${{ vars.BRAPI_MAX_SYMBOLS_PER_REQUEST }}
          STRIPE_PRICE_BASIC_MONTHLY=${{ vars.STRIPE_PRICE_BASIC_MONTHLY }}
          STRIPE_PRICE_BASIC_YEARLY=${{ vars.STRIPE_PRICE_BASIC_YEARLY }}
          APP_BASE_URL=${{ vars.APP_BASE_URL }}
          EOF

      - name: Deploy Hosting e Functions
        run: npx firebase deploy --only hosting,functions --project dindin-4e720 --force

      # Regras e índices entram no deploy desde a issue #321: publicá-los à
      # mão deixava produção divergir do que está versionado e testado — e o
      # índice de collectionGroup de `dividends` é obrigatório para o registro
      # automático de proventos.
      #
      # O risco de alteração acidental de segurança, que antes justificava
      # mantê-los de fora, é coberto pelos testes de regras: o job
      # `build-and-test-api` roda `firestore.rules.spec.ts` contra o emulador e
      # o deploy depende dele, então uma regra frouxa não chega a produção.
      #
      # Passo separado e **sem `--force`** de propósito: a flag faz o CLI
      # apagar, sem perguntar, índices que existam no projeto e não no
      # `firestore.indexes.json`. Sem ela, em modo não interativo, ele apenas
      # avisa e mantém — apagar índice continua sendo ato deliberado.
      - name: Deploy regras e índices
        run: npx firebase deploy --only firestore:rules,firestore:indexes,storage --project dindin-4e720

      # Registra a versão publicada como tag, servindo de base para o
      # cálculo da próxima versão.
      - name: Criar tag da versão
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
        run: |
          TAG="v$APP_VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "Tag $TAG já existe, nada a fazer."
            exit 0
          fi
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "$TAG"
