# Backfill da coleção mensal de proventos (issue #255).
#
# Migração one-shot: varre `quotes/{ticker}/history` (um snapshot por dia) e
# popula `quotes/{ticker}/dividendHistory` (um documento por mês). Fica fora do
# pipeline de deploy de propósito — rodar a cada push na main pagaria para
# sempre o custo de leitura que a #255 existe para eliminar.
#
# Deve ser acionado manualmente APÓS o deploy da API que introduz a coleção.
# É idempotente: o id do documento é o mês, então reexecutar sobrescreve com o
# mesmo conteúdo.
name: Backfill do histórico de proventos

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: 'Ticker único (ex.: HGLG11). Vazio processa todos.'
        required: false
        type: string

# Permissão mínima do GITHUB_TOKEN: o job não escreve no repositório.
permissions:
  contents: read

jobs:
  backfill:
    name: Executar backfill
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Exige a aprovação configurada no ambiente antes de escrever em produção.
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Executar backfill
        env:
          BACKFILL_TICKER: ${{ inputs.ticker }}
        run: npm run backfill:dividend-history --workspace=apps/api
