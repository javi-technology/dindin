# Version updates semanais e agrupados. Os PRs são abertos contra a develop,
# onde o CI (evento pull_request) valida cada bump antes do merge.
version: 2

updates:
  - package-ecosystem: npm
    # O lock do root resolve os workspaces apps/* e packages/*.
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
    # Cada dependência entra no primeiro grupo que casar.
    groups:
      angular:
        patterns:
          - '@angular/*'
          - '@angular-devkit/*'
          - '@schematics/angular'
          - 'zone.js'
      firebase:
        patterns:
          - 'firebase'
          - 'firebase-admin'
          - 'firebase-functions'
          - 'firebase-tools'
          - '@firebase/*'
      dev-tooling:
        patterns:
          - 'jest'
          - 'ts-jest'
          - '@types/jest'
          - 'karma*'
          - 'jasmine-core'
          - '@types/jasmine'
          - 'prettier'
          - 'typescript'
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    # Majors do Angular exigem `ng update` com migrações e dependem do
    # @angular/fire acompanhar; são tratados em issue própria.
    ignore:
      - dependency-name: '@angular/*'
        update-types:
          - version-update:semver-major
      - dependency-name: '@angular-devkit/*'
        update-types:
          - version-update:semver-major
      # O @angular/core@20 declara peer zone.js ~0.15.0 e o @angular/fire@20
      # depende de firebase@^11; ambos sobem junto com a migração ao Angular 21.
      - dependency-name: 'zone.js'
        versions:
          - '>=0.16.0'
      - dependency-name: 'firebase'
        update-types:
          - version-update:semver-major
      # TypeScript 7 (nativo) não expõe a API JS do compilador: quebra o
      # ts-jest e o @angular/compiler-cli@20 exige typescript <6.0.
      - dependency-name: 'typescript'
        update-types:
          - version-update:semver-major
      # O jasmine-core@7 quebra o karma-jasmine@5 (describe read-only); os tipos
      # acompanham a versão do jasmine-core.
      - dependency-name: 'jasmine-core'
        update-types:
          - version-update:semver-major
      - dependency-name: '@types/jasmine'
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    # Cobre os workflows em .github/workflows.
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns:
          - 'actions/*'
          - 'google-github-actions/*'
