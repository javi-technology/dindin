<section class="bg-surface-elevated rounded-2xl shadow-lg p-6">
  <h2 class="text-xl font-bold text-text-primary mb-4">
    Composição da carteira
  </h2>

  @if (!hasData()) {
    <p data-testid="composition-empty" class="text-text-secondary">
      Nenhuma posição na carteira para exibir a composição.
    </p>
  } @else {
    <div class="flex flex-col sm:flex-row items-center gap-6">
      <svg
        viewBox="0 0 200 200"
        class="w-48 h-48 shrink-0"
        role="img"
        aria-label="Gráfico de composição da carteira por ticker"
        data-testid="composition-chart"
      >
        @for (slice of slices(); track slice.label) {
          <path
            [attr.d]="slice.path"
            [attr.fill]="slice.color"
            class="stroke-surface-elevated"
            stroke-width="1"
            data-testid="composition-slice"
          >
            <title>
              {{ slice.label }}: {{ formatCurrency(slice.value) }} ({{
                formatPercent(slice.percent)
              }})
            </title>
          </path>
        }
        <text
          x="100"
          y="96"
          text-anchor="middle"
          class="fill-text-muted text-[10px]"
        >
          Total
        </text>
        <text
          x="100"
          y="112"
          text-anchor="middle"
          class="fill-text-primary text-[12px] font-bold"
        >
          {{ formatCurrency(total()) }}
        </text>
      </svg>

      <ul class="w-full grid grid-cols-1 sm:grid-cols-2 gap-x-6 gap-y-2">
        @for (slice of slices(); track slice.label) {
          <li
            class="flex items-center justify-between gap-3 text-sm"
            data-testid="composition-legend-item"
          >
            <span class="flex items-center gap-2 min-w-0">
              <span
                class="inline-block w-3 h-3 rounded-xs shrink-0"
                [style.background-color]="slice.color"
              ></span>
              <span class="font-medium text-text-primary truncate">{{
                slice.label
              }}</span>
            </span>
            <span class="text-text-secondary whitespace-nowrap">
              {{ formatPercent(slice.percent) }}
            </span>
          </li>
        }
      </ul>
    </div>
  }
</section>
