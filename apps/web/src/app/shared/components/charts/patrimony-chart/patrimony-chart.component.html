<section class="bg-white rounded-2xl shadow-lg p-6">
  <h2 class="text-xl font-bold text-gray-900 mb-4">Evolução patrimonial</h2>

  @if (!hasEnoughData()) {
    <p data-testid="patrimony-empty" class="text-gray-600">
      Ainda não há histórico suficiente. O primeiro snapshot foi registrado
      hoje; volte amanhã para ver a evolução.
    </p>
  } @else {
    <svg
      viewBox="0 0 600 220"
      class="w-full h-auto"
      role="img"
      aria-label="Gráfico de evolução patrimonial"
      data-testid="patrimony-chart"
    >
      @for (tick of yTicks(); track tick.y) {
        <line
          x1="65"
          x2="580"
          [attr.y1]="tick.y"
          [attr.y2]="tick.y"
          stroke="#e5e7eb"
          stroke-width="1"
        />
        <text
          x="58"
          [attr.y]="tick.y + 4"
          text-anchor="end"
          class="fill-gray-500 text-[10px]"
        >
          {{ tick.label }}
        </text>
      }

      <path [attr.d]="areaPath()" fill="#dbeafe" data-testid="patrimony-area" />
      <polyline
        [attr.points]="linePath()"
        fill="none"
        stroke="#2563eb"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      @for (point of points(); track point.x; let last = $last) {
        <circle
          [attr.cx]="point.x"
          [attr.cy]="point.y"
          r="4"
          [attr.fill]="last ? '#1d4ed8' : '#2563eb'"
        />
      }
      <text
        x="65"
        y="207"
        class="fill-gray-500 text-[10px]"
        data-testid="date-start"
      >
        {{ formatDate(snapshots()[0].date) }}
      </text>
      <text
        x="580"
        y="207"
        text-anchor="end"
        class="fill-gray-500 text-[10px]"
        data-testid="date-end"
      >
        {{ formatDate(snapshots()[snapshots().length - 1].date) }}
      </text>
    </svg>
  }
</section>
