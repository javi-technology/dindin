@if (shownError()) {
  <div
    class="bg-danger-soft text-danger-ink rounded-lg p-3 mb-4 text-sm"
    data-testid="form-error"
  >
    {{ shownError() }}
  </div>
}

<form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
  <div>
    <label
      for="item-ticker"
      class="block text-sm font-medium text-text-secondary mb-1"
      >Ticker</label
    >
    <select
      id="item-ticker"
      formControlName="ticker"
      class="w-full border border-border-strong rounded-lg px-3 py-2 text-sm focus:outline-hidden focus:ring-2 focus:ring-focus"
    >
      <option value="" disabled>Selecione um ativo</option>
      @for (asset of assets(); track asset.ticker) {
        <option [value]="asset.ticker">
          {{ asset.ticker }} — {{ asset.name }}
        </option>
      }
    </select>
    @if (assetsError()) {
      <p class="text-danger text-xs mt-1" data-testid="assets-error">
        {{ assetsError() }}
      </p>
    }
  </div>

  <div>
    <label
      for="item-quantity"
      class="block text-sm font-medium text-text-secondary mb-1"
      >Quantidade</label
    >
    <input
      id="item-quantity"
      type="number"
      step="any"
      formControlName="quantity"
      class="w-full border border-border-strong rounded-lg px-3 py-2 text-sm focus:outline-hidden focus:ring-2 focus:ring-focus"
    />
  </div>

  <div>
    <label
      for="item-transferred-price"
      class="block text-sm font-medium text-text-secondary mb-1"
      >Preço de transferência (R$)</label
    >
    <input
      id="item-transferred-price"
      type="text"
      formControlName="transferredPrice"
      class="w-full border border-border-strong rounded-lg px-3 py-2 text-sm focus:outline-hidden focus:ring-2 focus:ring-focus"
      placeholder="Ex: 110,50"
    />
  </div>

  <div>
    <label
      for="item-target-price"
      class="block text-sm font-medium text-text-secondary mb-1"
      >Preço-alvo (R$)</label
    >
    <input
      id="item-target-price"
      type="text"
      formControlName="targetPrice"
      class="w-full border border-border-strong rounded-lg px-3 py-2 text-sm focus:outline-hidden focus:ring-2 focus:ring-focus"
      placeholder="Ex: 120,00"
    />
  </div>

  <div class="flex justify-end gap-3 pt-2">
    <button
      type="button"
      class="px-4 py-2 text-sm font-medium text-text-secondary bg-surface-sunken hover:bg-border rounded-lg transition-colors"
      data-testid="btn-cancelar-item"
      (click)="close()"
    >
      Cancelar
    </button>
    <button
      type="submit"
      class="px-4 py-2 text-sm font-medium text-on-action bg-action hover:bg-action-hover rounded-lg transition-colors"
    >
      {{ item() ? 'Salvar' : 'Adicionar' }}
    </button>
  </div>
</form>
