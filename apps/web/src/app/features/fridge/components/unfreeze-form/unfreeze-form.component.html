<p class="text-text-secondary mb-6">
  Mover
  <strong>{{ item().ticker }}</strong> da geladeira para a carteira:
</p>

<form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
  @if (wallets().length > 0) {
    <select
      formControlName="walletId"
      class="w-full border border-border-strong rounded-lg px-3 py-2 text-sm focus:outline-hidden focus:ring-2 focus:ring-focus"
    >
      @for (wallet of wallets(); track wallet.id) {
        <option [value]="wallet.id">{{ wallet.name }}</option>
      }
    </select>
  } @else {
    <p class="text-text-muted text-sm">Nenhuma carteira disponível.</p>
  }

  @if (error()) {
    <p class="text-danger text-sm" data-testid="unfreeze-error">
      {{ error() }}
    </p>
  }

  <div class="flex justify-end gap-3">
    <button
      type="button"
      class="px-4 py-2 text-sm font-medium text-text-secondary bg-surface-sunken hover:bg-border rounded-lg transition-colors"
      data-testid="btn-cancelar-descongelar"
      (click)="close()"
    >
      Cancelar
    </button>
    <button
      type="submit"
      class="px-4 py-2 text-sm font-medium text-on-action bg-action hover:bg-action-hover rounded-lg transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
      [disabled]="wallets().length === 0 || form.invalid"
    >
      Descongelar
    </button>
  </div>
</form>
