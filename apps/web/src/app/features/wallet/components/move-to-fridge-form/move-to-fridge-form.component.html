<p class="text-gray-600 mb-4">
  Transferir <strong>{{ position().ticker }}</strong> da carteira para a
  geladeira.
</p>

@if (shownError()) {
  <div
    class="bg-red-50 text-red-800 rounded-lg p-3 mb-4 text-sm"
    data-testid="mover-error"
  >
    {{ shownError() }}
  </div>
}

<form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
  <div>
    <label
      for="mover-fridge-select"
      class="block text-sm font-medium text-gray-700 mb-1"
      >Geladeira de destino</label
    >
    <select
      id="mover-fridge-select"
      formControlName="fridgeId"
      data-testid="mover-fridge-select"
      class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-hidden focus:ring-2 focus:ring-cyan-500"
    >
      @for (fridge of fridges(); track fridge.id) {
        <option [value]="fridge.id">{{ fridge.name }}</option>
      }
    </select>
  </div>

  <div>
    <label
      for="mover-target-price"
      class="block text-sm font-medium text-gray-700 mb-1"
      >Preço-alvo</label
    >
    <input
      id="mover-target-price"
      type="text"
      inputmode="decimal"
      formControlName="targetPrice"
      data-testid="mover-target-price"
      class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-hidden focus:ring-2 focus:ring-cyan-500"
      [class.border-red-500]="
        form.get('targetPrice')?.invalid && form.get('targetPrice')?.touched
      "
    />
    @if (form.get('targetPrice')?.invalid && form.get('targetPrice')?.touched) {
      <p class="text-red-600 text-xs mt-1">Informe um preço-alvo válido.</p>
    }
  </div>

  <div class="flex justify-end gap-3 pt-2">
    <button
      type="button"
      class="px-4 py-2 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-100"
      data-testid="btn-cancelar-mover"
      (click)="close()"
    >
      Cancelar
    </button>
    <button
      type="submit"
      class="px-4 py-2 rounded-lg text-sm font-medium bg-cyan-600 text-white hover:bg-cyan-700 disabled:opacity-50"
      [disabled]="form.invalid"
    >
      Mover
    </button>
  </div>
</form>
