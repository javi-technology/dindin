<main class="min-h-screen bg-surface p-6">
  <div class="max-w-4xl mx-auto bg-surface-elevated rounded-2xl shadow-lg p-8">
    <h1 class="text-2xl font-bold text-text-primary mb-6">Proventos</h1>

    @if (loading()) {
      <p class="text-text-secondary" data-testid="loading-message">
        Carregando...
      </p>
    }

    @if (error()) {
      <div
        class="bg-danger-soft text-danger-ink rounded-lg p-4 mb-4"
        data-testid="error-message"
      >
        <p class="font-medium">{{ error() }}</p>
      </div>
    }

    @if (!loading() && !error()) {
      <div class="space-y-6">
        <app-dividend-kpis
          [total]="total()"
          [totalFromFridge]="totalFromFridge()"
          [yearTotal]="yearTotal()"
          [monthlyAverage]="monthlyAverage()"
          [lastMonth]="lastMonth()"
          [dividendYield]="dividendYield()"
          [yieldNeedsRecords]="yieldNeedsRecords()"
          [selectedYear]="selectedYear()"
        />

        @if (byTicker().length > 0) {
          <app-payment-schedule
            [schedule]="schedule()"
            [hiddenDateCount]="hiddenScheduleCount()"
            [hiddenWithoutDateCount]="hiddenWithoutDateCount()"
          />
        }

        @if (byTicker().length === 0) {
          <p class="text-text-secondary">Nenhum provento registrado.</p>
        } @else {
          <app-ticker-projection
            [cards]="cards()"
            [hiddenCount]="hiddenCount()"
          />
        }
      </div>
    }

    <app-monthly-report
      [report]="report()"
      [loading]="reportLoading()"
      [error]="reportError()"
      [selectedYear]="selectedYear()"
      [years]="reportYears()"
      [series]="monthlySeries()"
      [concentration]="tickerConcentration()"
      [monthlyAverage]="monthlyAverage()"
      (yearChange)="onYearChange($event)"
    />
  </div>
</main>
