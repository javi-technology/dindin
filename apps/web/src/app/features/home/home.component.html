<main
  class="min-h-screen flex flex-col items-center justify-center bg-gray-50 p-6"
>
  <div class="max-w-md w-full bg-white rounded-2xl shadow-lg p-8 text-center">
    <h1 class="text-3xl font-bold text-gray-900 mb-2">DinDin</h1>
    <p class="text-gray-600 mb-6">Controle de carteira de FIIs</p>

    <div class="border-t pt-6">
      <h2 class="text-lg font-semibold text-gray-800 mb-2">Hello World</h2>

      <div class="flex flex-col sm:flex-row gap-3 justify-center mb-4">
        <a
          routerLink="/carteira"
          class="inline-block bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2 rounded-lg transition-colors"
        >
          Acessar carteira
        </a>

        <a
          routerLink="/geladeira"
          class="inline-block bg-cyan-600 hover:bg-cyan-700 text-white font-medium px-4 py-2 rounded-lg transition-colors"
        >
          Acessar geladeira
        </a>
      </div>

      @if (healthStatus) {
        <div class="bg-green-50 text-green-800 rounded-lg p-4 mb-3">
          <p class="font-medium">Backend online</p>
          <p class="text-sm">Status: {{ healthStatus }}</p>
          <p class="text-sm">Projeto: {{ healthProject }}</p>
        </div>
      }

      @if (healthError) {
        <div class="bg-red-50 text-red-800 rounded-lg p-4">
          <p class="font-medium">Erro ao conectar ao backend</p>
          <p class="text-sm">{{ healthError }}</p>
        </div>
      }
    </div>
  </div>
</main>
