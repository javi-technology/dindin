<main class="min-h-screen flex items-center justify-center bg-gray-50 p-6">
  <div class="w-full max-w-sm bg-white rounded-2xl shadow-lg p-8">
    <h1 class="text-2xl font-bold text-center text-gray-900 mb-2">DinDin</h1>
    <p class="text-center text-gray-600 mb-6">Entre na sua conta</p>

    <form (ngSubmit)="loginWithEmail()" class="space-y-4">
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700">E-mail</label>
        <input
          id="email"
          type="email"
          [(ngModel)]="email"
          name="email"
          required
          class="mt-1 w-full rounded-lg border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-gray-700">Senha</label>
        <input
          id="password"
          type="password"
          [(ngModel)]="password"
          name="password"
          required
          class="mt-1 w-full rounded-lg border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>

      @if (error) {
        <div class="text-sm text-red-600 bg-red-50 rounded-lg p-3">{{ error }}</div>
      }

      <button
        type="submit"
        [disabled]="loading"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg disabled:opacity-50"
      >
        Entrar
      </button>
    </form>

    <button
      (click)="loginWithGoogle()"
      [disabled]="loading"
      class="mt-4 w-full bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 font-medium py-2 px-4 rounded-lg disabled:opacity-50"
    >
      Entrar com Google
    </button>
  </div>
</main>
