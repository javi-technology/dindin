<main
  class="min-h-screen flex items-center justify-center bg-surface-sunken p-6"
>
  <div class="w-full max-w-sm bg-surface-elevated rounded-2xl shadow-lg p-8">
    <h1 class="text-2xl font-bold text-center text-text-primary mb-2">
      DinDin
    </h1>
    <p class="text-center text-text-secondary mb-6">Entre na sua conta</p>

    <form (ngSubmit)="loginWithEmail()" class="space-y-4">
      <div>
        <label for="email" class="block text-sm font-medium text-text-secondary"
          >E-mail</label
        >
        <input
          id="email"
          type="email"
          [(ngModel)]="email"
          name="email"
          required
          class="mt-1 w-full rounded-lg border border-border-strong px-3 py-2 focus:outline-hidden focus:ring-2 focus:ring-focus"
        />
      </div>

      <div>
        <label
          for="password"
          class="block text-sm font-medium text-text-secondary"
          >Senha</label
        >
        <input
          id="password"
          type="password"
          [(ngModel)]="password"
          name="password"
          required
          class="mt-1 w-full rounded-lg border border-border-strong px-3 py-2 focus:outline-hidden focus:ring-2 focus:ring-focus"
        />
      </div>

      @if (error()) {
        <div class="text-sm text-danger-ink bg-danger-soft rounded-lg p-3">
          {{ error() }}
        </div>
      }

      <button
        type="submit"
        [disabled]="loading()"
        class="w-full bg-action hover:bg-action-hover text-on-action font-medium py-2 px-4 rounded-lg disabled:opacity-50"
      >
        Entrar
      </button>
    </form>

    <button
      (click)="loginWithGoogle()"
      [disabled]="loading()"
      class="mt-4 w-full bg-surface-elevated border border-border-strong hover:bg-surface-sunken text-text-secondary font-medium py-2 px-4 rounded-lg disabled:opacity-50"
    >
      Entrar com Google
    </button>
  </div>
</main>
