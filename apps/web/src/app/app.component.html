<header
  class="bg-white shadow-sm px-6 py-4 flex flex-wrap justify-between items-center gap-3"
>
  <div class="flex items-center gap-2">
    <a
      routerLink="/"
      class="text-xl font-bold text-gray-900 hover:text-blue-600 transition-colors"
      >DinDin</a
    >
    @if (user() && subscriptionLoaded()) {
      <span
        data-testid="subscription-badge"
        class="rounded-full px-2 py-0.5 text-xs font-medium"
        [class]="
          isSubscriber()
            ? 'bg-emerald-100 text-emerald-700'
            : 'bg-gray-100 text-gray-600'
        "
      >
        {{ isSubscriber() ? 'Assinante' : 'Não assinante' }}
      </span>
    }
  </div>
  <div class="flex flex-wrap items-center gap-4">
    @if (user(); as currentUser) {
      <nav class="flex flex-wrap items-center gap-4" data-testid="main-nav">
        <a
          routerLink="/"
          routerLinkActive="!text-blue-600 font-semibold"
          [routerLinkActiveOptions]="{ exact: true }"
          class="text-sm font-medium text-gray-700 hover:text-blue-600"
          >Dashboard</a
        >
        <a
          routerLink="/carteira"
          routerLinkActive="!text-blue-600 font-semibold"
          class="text-sm font-medium text-gray-700 hover:text-blue-600"
          >Carteira</a
        >
        <a
          routerLink="/geladeira"
          routerLinkActive="!text-blue-600 font-semibold"
          class="text-sm font-medium text-gray-700 hover:text-blue-600"
          >Geladeira</a
        >
        <a
          routerLink="/provento"
          routerLinkActive="!text-blue-600 font-semibold"
          class="text-sm font-medium text-gray-700 hover:text-blue-600"
          >Proventos</a
        >
        <a
          routerLink="/carteira-recomendada"
          routerLinkActive="!text-blue-600 font-semibold"
          class="text-sm font-medium text-gray-700 hover:text-blue-600"
          data-testid="recommended-wallet-link"
          >Carteira recomendada</a
        >
        <a
          routerLink="/assinatura"
          routerLinkActive="!text-blue-600 font-semibold"
          class="text-sm font-medium text-gray-700 hover:text-blue-600"
          data-testid="billing-link"
          >Assinatura</a
        >
      </nav>
      <span class="text-sm text-gray-700 hidden sm:inline">{{
        currentUser.email
      }}</span>
      <button
        (click)="logout()"
        class="text-sm text-red-600 hover:text-red-800 font-medium"
      >
        Sair
      </button>
    }
  </div>
</header>

<router-outlet />

<footer class="px-6 py-4 text-center text-xs text-gray-400">
  <span data-testid="app-version">v{{ version }}</span>
</footer>
